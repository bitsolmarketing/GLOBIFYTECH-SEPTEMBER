# Globify Tech — full stack for local development or a single-server deploy.
#
#   cp .env.example .env     # fill in the secrets first
#   docker compose up -d
#   docker compose exec app pnpm db:deploy && docker compose exec app pnpm db:seed
#
# For production, point DATABASE_URL at a managed PostgreSQL and drop the
# postgres service; keep redis if you want reliable background jobs.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-globify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globify}
      POSTGRES_DB: ${POSTGRES_DB:-globify}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./prisma/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globify} -d ${POSTGRES_DB:-globify}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-globify}:${POSTGRES_PASSWORD:-globify}@postgres:5432/${POSTGRES_DB:-globify}
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:3000"

  # Background jobs: reminders, risk scoring, PDF rendering, notifications.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-globify}:${POSTGRES_PASSWORD:-globify}@postgres:5432/${POSTGRES_DB:-globify}
      REDIS_URL: redis://redis:6379
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/server/jobs/worker.ts"]

volumes:
  postgres-data:
  redis-data:
