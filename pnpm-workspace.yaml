allowBuilds:
  sharp: true
  unrs-resolver: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  bcrypt: false
  '@parcel/watcher': false
  '@swc/core': false
  msgpackr-extract: false

# Newer pnpm releases block packages under 24h old. The pinned AI SDK
# versions were locked before that window closed; exempt only those.
minimumReleaseAgeExclude:
  - ai
  - '@ai-sdk/*'

# Flat node_modules (no symlinks). Hostinger copies Next's standalone output
# and runs it from there; pnpm's symlinked layout left Next unable to resolve
# its own dependencies (e.g. @swc/helpers) at runtime.
nodeLinker: hoisted
