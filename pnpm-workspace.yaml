allowBuilds:
  sharp: true
  unrs-resolver: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  bcrypt: false
  '@parcel/watcher': false
  '@swc/core': false
  msgpackr-extract: false

# pnpm 12 blocks packages newer than 24h by default. The pinned AI SDK
# versions were locked before that window closed; exempt only those.
minimumReleaseAgeExclude:
  - ai
  - '@ai-sdk/*'
